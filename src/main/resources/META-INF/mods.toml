modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="ifchat.png"
description='''IfChat — 两个聊天相关功能：
1) execute if / unless chat <targets> exact|contains "文本"：检测玩家最近的发言内容，可用来做聊天触发；
2) 强制服务端聊天以未签名形式下发，规避 1.20.1 联机时“聊天消息验证失败”掉线。'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
